name: phase2-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Toolchain version
        run: |
          rustc --version
          cargo --version

      - name: Resolve dependency graph for lockfile bootstrap
        run: |
          cargo generate-lockfile
          echo '-----BEGIN ICC CARGO.LOCK-----'
          cat Cargo.lock
          echo '-----END ICC CARGO.LOCK-----'

      - name: Architecture boundary check
        run: python3 scripts/check_architecture.py

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Portable no_std checks
        run: |
          cargo check -p icc-types --no-default-features
          cargo check -p icc-error --no-default-features
          cargo check -p icc-rights --no-default-features
          cargo check -p icc-platform-api --no-default-features
          cargo check -p icc-capability-core --no-default-features
          cargo check -p icc-identity-core --no-default-features
          cargo check -p icc-crypto-api --no-default-features
          cargo check -p icc-crypto-rust --no-default-features

      - name: Release build
        run: cargo build --workspace --release
