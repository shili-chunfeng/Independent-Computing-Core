name: phase2-doc-correction

on:
  push:

permissions:
  contents: write

jobs:
  correct:
    if: github.ref == 'refs/heads/phase-2-cryptographic-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Correct getrandom feature wording exactly once
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/security/Phase_2_Dependency_Review_v0.1.md')
          text = path.read_text(encoding='utf-8')
          old = '| `getrandom` | 0.4.3 | Linux/platform CSPRNG adapter | rust-random/getrandom; crates.io | MIT OR Apache-2.0 | yes / no | defaults disabled; actual `(none)` |'
          new = '| `getrandom` | 0.4.3 | Linux/platform CSPRNG adapter | rust-random/getrandom; crates.io | MIT OR Apache-2.0 | yes / no | default features not explicitly disabled; resolved feature set `(none)` |'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected getrandom review row not found')
          PY

          if git diff --quiet -- docs/security/Phase_2_Dependency_Review_v0.1.md; then
            echo 'Dependency review wording already corrected.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/security/Phase_2_Dependency_Review_v0.1.md
          git commit -m 'docs(phase2): correct getrandom feature review wording'
          git push origin HEAD:phase-2-cryptographic-hardening
