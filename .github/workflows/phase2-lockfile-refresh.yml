name: phase2-lockfile-refresh

on:
  push:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/phase-2-cryptographic-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Refresh lockfile after CLI dependency removal
        run: |
          if grep -Eq '^icc-crypto-(api|rust) =' apps/indie-cli/Cargo.toml; then
            echo 'CLI dependency removal is not committed yet; no repository write performed.'
            exit 0
          fi

          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock already matches the manifest graph.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'phase2(build): refresh Cargo lock after CLI dependency removal'
          git push origin HEAD:phase-2-cryptographic-hardening
